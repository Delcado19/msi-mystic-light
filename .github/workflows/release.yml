name: Release

# On a v* tag: build, test and package the installable Windows ZIP (scripts/package_release.py)
# and attach it to a DRAFT GitHub release; the owner publishes it after the hardware test.
# Test packages for branches and PRs come from ci.yml run artifacts instead.
# Build steps mirror ci.yml; see the comments there for the Qt and hidapi choices.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: "qtimageformats"

      - name: Install hidapi via vcpkg
        shell: pwsh
        run: vcpkg install hidapi:x64-windows

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qtdir }}"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test (Release)
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure --timeout 600

      - name: Package
        id: package
        shell: pwsh
        run: |
          $archive = "build/dist/LightingStudio-$env:GITHUB_REF_NAME-windows-x64.zip"
          python scripts/package_release.py --runtime build/Release --archive $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.archive }}.sha256" --draft --title "Lighting Studio $env:GITHUB_REF_NAME" --generate-notes
