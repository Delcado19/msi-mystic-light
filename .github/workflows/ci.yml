name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Self-hosted: GitHub-hosted Windows runners bill against the private-repo
    # Actions minutes quota (2x multiplier); self-hosted runners never do.
    runs-on: [self-hosted, Windows, msi-mystic-light]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" `
            -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="C:/Program Files/Microsoft Visual Studio/18/Community/VC/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" `
            --build build --config Debug

      - name: Test
        shell: pwsh
        run: |
          & "C:\Program Files\Microsoft Visual Studio\18\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\ctest.exe" `
            --test-dir build -C Debug --output-on-failure
