name: CI

# Builds the Windows app and runs the hardware-free CTest suite.
# Physical-device qualification (CONTINUE.md) stays a separate, manual step.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version the local build (build/aurora-build.cmd) uses, so CI
      # exercises the same Qt release as a developer machine. No 'arch' pin and no
      # msvc-dev-cmd step: the default CMake generator on windows-latest is the
      # Visual Studio toolset, which locates cl.exe itself.
      # 'qtsvg' is NOT a valid --modules entry here: QtSvg ships as part of the
      # Qt6 desktop essentials (unlike Qt5's addon), and aqt rejects it
      # ("package not found while parsing XML") -- confirmed by this repo's own
      # earlier CI history (commit c414db8). Only the WebP image-format plugin
      # (CMakeLists.txt's fatal-error check for qwebp(d).dll) needs an addon.
      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: "qtimageformats"

      # hidapi has no pinned version here (classic vcpkg mode, no vcpkg.json);
      # windows-latest runners ship vcpkg pre-installed.
      - name: Install hidapi via vcpkg
        shell: pwsh
        run: vcpkg install hidapi:x64-windows

      # The vcpkg toolchain file adds the installed tree to CMake's search
      # paths, which cmake/Findhidapi.cmake's plain find_path/find_library
      # calls pick up too (no CONFIG mode needed).
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qtdir }}"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test (Release)
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure --timeout 600
