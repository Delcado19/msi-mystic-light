name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Public repo: GitHub-hosted Actions minutes are unmetered here, unlike
    # on a private repo (where Windows runners bill at a 2x multiplier).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtsvg'

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure
